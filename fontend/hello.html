
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SmartDoc AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8f5;
    color: #20352a;
}

header {
    background: #ffffff;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e3ebe5;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #16834b;
}

main {
    max-width: 850px;
    margin: 45px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #728078;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 28px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000009;
    margin-bottom: 22px;
}

.upload {
    border: 2px dashed #91c6a4;
    background: #f7fcf8;
    padding: 40px 15px;
    text-align: center;
    border-radius: 12px;
}

input {
    margin: 20px 0;
    max-width: 100%;
}

button {
    background: #16834b;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    background: #9ca9a0;
    cursor: not-allowed;
}

button:hover:not(:disabled) {
    background: #10683a;
}

#preview {
    display: none;
    max-width: 100%;
    max-height: 250px;
    margin: 20px auto;
    border-radius: 10px;
}

#status {
    margin-top: 15px;
    color: #16834b;
    font-weight: bold;
}

.result {
    white-space: pre-wrap;
    background: #f4f7f5;
    padding: 18px;
    border-radius: 8px;
    min-height: 60px;
    overflow-wrap: anywhere;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    color: #829087;
    padding: 30px;
}
</style>
</head>

<body>

<header>
    <div class="logo">SmartDoc AI</div>
    <span>AI Document Reader</span>
</header>

<main>

    <h1>Smart Document Reader</h1>

    <p class="subtitle">
        Upload dokumen dan biarkan AI membaca teks secara otomatis.
    </p>

    <section class="card">

        <h3>Upload Dokumen</h3>

        <div class="upload">

            <p>Pilih gambar kuitansi, KTM, atau dokumen</p>

            <input
                type="file"
                id="fileInput"
                accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            >

            <img id="preview">

            <br>

            <button id="processBtn" onclick="processOCR()">
                Mulai Proses OCR
            </button>

        </div>

        <div id="status"></div>

    </section>

    <section class="card hidden" id="resultCard">

        <h3>Hasil Pembacaan AI</h3>

        <h4>Extracted Text</h4>

        <div class="result" id="textResult">
            Menunggu hasil...
        </div>

        <h4>JSON Result</h4>

        <div class="result" id="jsonResult">
            Menunggu hasil...
        </div>

    </section>

</main>

<footer>
    SmartDoc AI | Powered by AWS
</footer>

<script>

// GANTI DENGAN INVOKE URL API GATEWAY
const API_URL = "https://xm9u7dpumd.execute-api.us-east-1.amazonaws.com";

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const statusText = document.getElementById("status");
const processBtn = document.getElementById("processBtn");

fileInput.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

});

async function processOCR() {

    const file = fileInput.files[0];

    if (!file) {
        alert("Silakan pilih dokumen terlebih dahulu");
        return;
    }

    if (!["image/jpeg", "image/png"].includes(file.type)) {
        alert("Format harus JPG atau PNG");
        return;
    }

    if (file.size > 4 * 1024 * 1024) {
        alert("Ukuran file maksimal 4 MB");
        return;
    }

    processBtn.disabled = true;

    document.getElementById("resultCard")
        .classList.add("hidden");

    try {

        statusText.textContent = "Meminta URL upload...";

        // 1. Meminta URL upload ke API Gateway
        const uploadResponse = await fetch(
            API_URL + "/upload-url",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    filename: file.name,
                    content_type: file.type
                })
            }
        );

        const uploadData = await uploadResponse.json();

        if (!uploadResponse.ok) {
            throw new Error(
                uploadData.error || "Gagal membuat URL upload"
            );
        }

        const documentId = uploadData.document_id;

        // 2. Upload gambar langsung ke S3
        statusText.textContent = "Mengunggah dokumen ke S3...";

        const s3Response = await fetch(
            uploadData.upload_url,
            {
                method: "PUT",
                headers: {
                    "Content-Type": file.type
                },
                body: file
            }
        );

        if (!s3Response.ok) {
            throw new Error("Upload S3 gagal");
        }

        // 3. Menunggu Lambda dan Textract
        statusText.textContent = "AI sedang membaca dokumen...";

        let completed = false;

        for (let i = 0; i < 40; i++) {

            await new Promise(resolve =>
                setTimeout(resolve, 2000)
            );

            const resultResponse = await fetch(
                API_URL + "/result?id=" +
                encodeURIComponent(documentId)
            );

            const result = await resultResponse.json();

            if (!resultResponse.ok) {
                throw new Error(
                    result.error || "Gagal mengambil hasil"
                );
            }

            if (result.status === "COMPLETED") {

                document.getElementById("textResult")
                    .textContent =
                    result.extracted_text || "Tidak ada teks";

                document.getElementById("jsonResult")
                    .textContent =
                    JSON.stringify(result, null, 2);

                document.getElementById("resultCard")
                    .classList.remove("hidden");

                statusText.textContent =
                    "Berhasil! Dokumen selesai dibaca AI.";

                completed = true;
                break;
            }

            if (result.status === "FAILED") {
                throw new Error(
                    result.error_message || "OCR gagal"
                );
            }

            statusText.textContent =
                "AI sedang memproses... Status: " +
                result.status;
        }

        if (!completed) {
            throw new Error(
                "Waktu tunggu habis. Periksa status di AWS."
            );
        }

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Terjadi kesalahan: " + error.message;

    } finally {

        processBtn.disabled = false;

    }
}

</script>

</body>
</html>
